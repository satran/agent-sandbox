# Sourced by bin/sb. Host paths are relative to the repo root.

# agy reuses ~/.gemini (settings in ~/.gemini/antigravity-cli). The login
# token is in the keyring that agy-start sets up under ~/.local/share/keyrings.
CONFIG_MOUNTS=(
	"home/antigravity/.gemini:/home/agent/.gemini"
	"home/antigravity/keyrings:/home/agent/.local/share/keyrings"
)
# agy updates itself into ~/.local/bin, which is not persisted; the image
# pins the version instead. Rebuild with --rebuild to update.
AGENT_ENV=(AGY_CLI_DISABLE_AUTO_UPDATE=true)
AGENT_CMD=(agy-start --dangerously-skip-permissions)
# Each run starts its own keyring daemon on the same keyring files.
AGENT_SINGLE_RUN=1
