# Sourced by bin/sb. Host paths are relative to the repo root.

# codex keeps config, credentials (auth.json) and sessions in ~/.codex.
# Its own sandbox is bypassed: the container is the sandbox, and codex's
# landlock/seccomp setup can't work with all capabilities dropped anyway.
CONFIG_MOUNTS=("home/codex/.codex:/home/agent/.codex")
AGENT_ENV=(CODEX_HOME=/home/agent/.codex)
AGENT_CMD=(codex --dangerously-bypass-approvals-and-sandbox)
