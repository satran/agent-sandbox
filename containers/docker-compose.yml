# The agent images are FROM sandbox-base; build it first:
#   docker compose build base
services:
  base:
    build: ./base
    image: sandbox-base
    profiles: [build] # image only, never started by `docker compose up`

  gemini:
    build: ./gemini
    container_name: gemini
    volumes:
      - ../home/gemini/.gemini:/home/satran/.gemini
      - ../../src:/home/satran/src
    stdin_open: true # allows interactive terminal
    tty: true        # allows interactive terminal
    hostname: gemini

  claude:
    build: ./claude
    container_name: claude
    volumes:
      - ../home/claude/.claude:/home/satran/.claude
      - ../../src:/home/satran/src
    stdin_open: true # allows interactive terminal
    tty: true        # allows interactive terminal
    hostname: claude

  omp:
    build: ./omp
    container_name: omp
    volumes:
      - ../home/omp/:/home/satran/.omp
      - ../../src:/home/satran/src
    stdin_open: true # allows interactive terminal
    tty: true        # allows interactive terminal
    hostname: omp

  sandbox:
    build: ./sandbox
    container_name: sandbox
    stdin_open: true # allows interactive terminal
    tty: true        # allows interactive terminal
    hostname: sandbox
