# Sourced by bin/sandbox. Host paths are relative to the repo root.

# Keeps .gemini.json inside the mounted dir so onboarding/settings persist.
CONFIG_MOUNTS=("home/gemini/.gemini:/home/satran/.gemini")
AGENT_ENV=(gemini_CONFIG_DIR=/home/satran/.gemini)
AGENT_CMD=(gemini --dangerously-skip-permissions)
