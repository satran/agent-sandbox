# Sourced by bin/sandbox. Host paths are relative to the repo root.

# Gemini keeps settings and credentials in ~/.gemini, so mounting it there
# persists them; no config-dir env var needed.
CONFIG_MOUNTS=("home/gemini/.gemini:/home/satran/.gemini")
# Workspace (company) Google accounts need a GCP project for Code Assist, or
# login fails and the CLI deletes the creds. Bare names pass the host value
# through to docker -e; unset ones are skipped.
AGENT_ENV=(GOOGLE_CLOUD_PROJECT GOOGLE_CLOUD_PROJECT_ID)
AGENT_CMD=(gemini --yolo)
