# Sourced by bin/sb. Host paths are relative to the repo root.

# opencode follows XDG: settings in ~/.config/opencode, credentials and
# sessions in ~/.local/share/opencode, history in ~/.local/state/opencode.
CONFIG_MOUNTS=(
	"home/opencode/config:/home/satran/.config/opencode"
	"home/opencode/share:/home/satran/.local/share/opencode"
	"home/opencode/state:/home/satran/.local/state/opencode"
)
AGENT_CMD=(opencode)
