# tmux config for sandbox containers. Mounted read-only at ~/.tmux.conf by
# bin/sb, so changes need `sb <agent> --recreate` (or `C-b r` for a
# running session if the file was edited in place).
#
# Expects SANDBOX_HOST (the docker host's name) and SANDBOX_PROJECT (the
# project's path on that host) in the environment; both are optional.

# --- terminal / agent friendliness -------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g extended-keys on          # shift+enter etc. reach the agent
set -as terminal-features ",*:extkeys"
set -g focus-events on
set -g allow-passthrough on      # OSC sequences (notifications, images)
set -g set-clipboard on
set -g escape-time 10
set -g history-limit 100000
set -g mouse on
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S @ #{@host} - #W"

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- palette (tokyo night) -----------------------------------------------------

set -g @bg     "#1a1b26"
set -g @bg2    "#24283b"
set -g @bg3    "#3b4261"
set -g @fg     "#a9b1d6"
set -g @muted  "#565f89"
set -g @blue   "#7aa2f7"
set -g @purple "#bb9af7"
set -g @green  "#9ece6a"
set -g @orange "#ff9e64"
set -g @red    "#f7768e"
set -g @cyan   "#7dcfff"

# Host the container runs on; falls back to the container hostname.
set -g @host "${SANDBOX_HOST}"
if -F "#{==:#{@host},}" "set -g @host '#h'"
set -g @project "${SANDBOX_PROJECT}"

# --- status bar ----------------------------------------------------------------

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 80
set -g status-right-length 160

# [ session ] agent on host   — the session block turns orange while the
# prefix is pending and purple in copy mode.
set -g status-left "\
#{?client_prefix,#[bg=#{@orange}],#{?pane_in_mode,#[bg=#{@purple}],#[bg=#{@blue}]}}\
#[fg=#{@bg},bold] #S \
#[bg=#{@bg2},fg=#{@purple},nobold] #{host_short} \
#[fg=#{@muted}]on #[fg=#{@cyan}]#{@host} \
#[bg=#{@bg}] "

# window list: index + name, flags for zoom / last / activity
set -g window-status-separator ""
set -g window-status-format "\
#[fg=#{@muted}] #I \
#[fg=#{@fg}]#W\
#{?window_zoomed_flag,#[fg=#{@orange}] [Z],}\
#{?window_last_flag,#[fg=#{@muted}] -,} "
set -g window-status-current-format "\
#[bg=#{@bg3},fg=#{@blue},bold] #I \
#[fg=#{@fg}]#W\
#{?window_zoomed_flag,#[fg=#{@orange}] [Z],} \
#[bg=#{@bg}]"
set -g window-status-activity-style "fg=#ff9e64"
set -g window-status-bell-style "fg=#f7768e,bold"
set -g monitor-activity on
set -g visual-activity off

# cwd (git branch) | load | mem | date time
set -g status-right "\
#[fg=#{@muted}]#{?@project,#{=/-40/…:@project},#{=/-40/…:#{s|^${HOME}|~|:pane_current_path}}}\
#[fg=#{@green}]#(b=\$(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) && [ -n \"\$b\" ] && printf ' (%%s)' \"\$b\") \
#[bg=#{@bg2},fg=#{@muted}] load #[fg=#{@fg}]#(cut -d' ' -f1-3 /proc/loadavg) \
#[fg=#{@muted}]mem #[fg=#{@fg}]#(awk '{printf \"%%.1fG\", \$1/1073741824}' /sys/fs/cgroup/memory.current 2>/dev/null || echo ?) \
#[bg=#{@bg3},fg=#{@fg}] %a %d %b \
#[bg=#{@blue},fg=#{@bg},bold] %H:%M "

# --- panes, messages, copy mode ------------------------------------------------

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"
set -g message-style "bg=#24283b,fg=#7aa2f7"
set -g message-command-style "bg=#24283b,fg=#bb9af7"
set -g mode-style "bg=#3b4261,fg=#a9b1d6"
set -g clock-mode-colour "#7aa2f7"
